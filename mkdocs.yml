site_name: ClaudeMon — Implementation
site_description: "ClaudeMon as built: features, architecture, code map, testing, reviews and releases (docs branch, P56)"
docs_dir: docs
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  # Requirement and test-case IDs are cited by anchor (### R-CMUSE-004 -> #r-cmuse-004-...); keep headings stable.
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

